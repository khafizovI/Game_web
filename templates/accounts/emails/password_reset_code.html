<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Password Reset Code</title>
</head>
<body style="margin:0;background:#f4f7fb;font-family:Arial,Helvetica,sans-serif;color:#172033;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#f4f7fb;padding:32px 12px;">
        <tr>
            <td align="center">
                <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:560px;background:#ffffff;border-radius:18px;overflow:hidden;box-shadow:0 18px 45px rgba(23,32,51,0.12);">
                    <tr>
                        <td style="background:#3157d5;padding:30px 28px;text-align:center;color:#ffffff;">
                            <div style="font-size:14px;font-weight:700;letter-spacing:2px;text-transform:uppercase;">QuizBattle</div>
                            <h1 style="margin:12px 0 0;font-size:28px;line-height:1.2;">Password reset code</h1>
                        </td>
                    </tr>
                    <tr>
                        <td style="padding:32px 28px;text-align:center;">
                            <p style="margin:0 0 10px;font-size:16px;line-height:1.6;">Hi {{ user.username }},</p>
                            <p style="margin:0 0 24px;font-size:15px;line-height:1.6;color:#5f6b7a;">
                                Use this 6-digit code to reset your QuizBattle password. It expires in 10 minutes.
                            </p>

                            <div style="display:inline-block;background:#f0f4ff;border:2px dashed #3157d5;border-radius:14px;padding:18px 28px;margin:4px 0 22px;">
                                <div style="font-size:36px;line-height:1;font-weight:800;letter-spacing:8px;color:#172033;font-family:'Courier New',monospace;">
                                    {{ code }}
                                </div>
                            </div>

                            <p style="margin:0;font-size:13px;line-height:1.6;color:#7a8794;">
                                You can select and copy the code above. If you did not request this, ignore this email.
                            </p>
                        </td>
                    </tr>
                    <tr>
                        <td style="padding:18px 28px;background:#f8fafc;text-align:center;color:#8a95a3;font-size:12px;">
                            This email was sent automatically by QuizBattle.
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>
</html>
