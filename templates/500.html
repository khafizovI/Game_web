{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>500 | QuizBattle</title>
    <link rel="icon" type="image/x-icon" href="{% static 'images/favicon.ico' %}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/custom.css' %}">
</head>
<body>
    <section class="error-shell">
        <div class="error-panel">
            <div class="error-copy">
                <div class="error-badge">
                    <i class="fas fa-triangle-exclamation"></i>
                    Server error
                </div>
                <div class="error-code">500</div>
                <h1 class="error-title">Server ichida xatolik yuz berdi.</h1>
                <p class="error-description">
                    Sahifa vaqtincha ishlamayapti. Bir necha soniyadan keyin qayta urinib ko‘ring. Muammo davom etsa, server loglarini tekshirish kerak bo‘ladi.
                </p>
                <div class="error-actions">
                    <a href="{% url 'home' %}" class="btn btn-primary btn-lg">
                        <i class="fas fa-house me-2"></i>Home ga qaytish
                    </a>
                    <a href="javascript:location.reload()" class="btn btn-outline-dark btn-lg">
                        <i class="fas fa-rotate-right me-2"></i>Refresh
                    </a>
                </div>
            </div>
            <div class="error-visual">
                <div class="error-orbit"></div>
                <div class="error-monitor">
                    <div class="error-screen">
                        <div class="error-screen-top">
                            <span></span>
                            <span></span>
                            <span></span>
                        </div>
                        <div class="error-screen-code">500</div>
                        <div class="error-lines">
                            <span></span>
                            <span></span>
                            <span></span>
                        </div>
                    </div>
                    <div class="error-stand"></div>
                </div>
            </div>
        </div>
    </section>
</body>
</html>
