<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join Game - QuizBattle</title>
    <style>
        body {
            background: linear-gradient(135deg, #7f53ac, #6577cb);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .join-container {
            background: white;
            padding: 40px 50px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            text-align: center;
            width: 100%;
            max-width: 400px;
        }
        .join-container h1 {
            font-size: 2rem;
            margin-bottom: 30px;
            color: #333;
        }
        .join-container input {
            width: 100%;
            padding: 18px;
            margin-bottom: 25px;
            border: 1px solid #ddd;
            border-radius: 8px;
            text-align: center;
            font-size: 1.8rem;
            letter-spacing: 0.5rem;
            font-weight: bold;
            box-sizing: border-box;
            text-transform: uppercase;
        }
        .join-container input::placeholder {
            font-weight: normal;
            letter-spacing: normal;
            text-transform: none;
        }
        .join-container button {
            width: 100%;
            padding: 18px;
            border: none;
            border-radius: 8px;
            background-color: #8a2be2;
            color: white;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }
        .join-container button:hover {
            background-color: #7324b8;
        }
        .messages {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            width: 90%;
            max-width: 400px;
        }
        .alert {
            padding: 15px;
            margin-bottom: 20px;
            border: 1px solid transparent;
            border-radius: .25rem;
            color: #fff;
            background-color: #f44336; /* Red for errors */
            text-align: center;
        }
        .alert-success {
            background-color: #4CAF50;
        }
    </style>
</head>
<body>
    {% if messages %}
    <div class="messages">
        {% for message in messages %}
        <div class="alert alert-{{ message.tags }}" role="alert">
            {{ message }}
        </div>
        {% endfor %}
    </div>
    {% endif %}

    <div class="join-container">
        <h1>QuizBattle</h1>
        <form method="POST">
            {% csrf_token %}
            <input type="text" name="game_code" placeholder="GAME PIN" maxlength="6" autofocus required>
            <button type="submit">Enter</button>
        </form>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const codeInput = document.querySelector('input[name="game_code"]');
            if (codeInput) {
                codeInput.addEventListener('input', function() {
                    this.value = this.value.toUpperCase();
                });
            }
        });
    </script>
</body>
</html>
